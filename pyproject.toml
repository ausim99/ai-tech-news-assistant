[project]
name = "ai-tech-news-assistant"
version = "0.1.0"
description = "AI Tech News Assistant - daily AI/tech digest in Bangla via Telegram & WhatsApp"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "loguru>=0.7",
    "tzdata>=2024.2",
    "feedparser>=6.0",
]

[dependency-groups]
dev = [
    "uvicorn[standard]>=0.32",
    "ruff>=0.7",
    "black>=24.10",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
