name: Daily News Pipeline

# 00:00 UTC = 06:00 Asia/Dhaka (UTC+6)
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_TO_NUMBER: ${{ secrets.WHATSAPP_TO_NUMBER }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/run-pipeline

      - uses: ./.github/actions/notify-failure
        if: failure()
        with:
          message: "Daily pipeline failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
