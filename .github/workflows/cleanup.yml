name: Cleanup Old Data

# Sunday 03:00 UTC
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env

      - name: Run cleanup
        run: uv run python scripts/cleanup.py --retention-days ${{ vars.DATA_RETENTION_DAYS || 90 }}

      - uses: ./.github/actions/commit-data
        with:
          message: 'chore: rotate old news data'

      - uses: ./.github/actions/notify-failure
        if: failure()
        with:
          message: "Cleanup failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
