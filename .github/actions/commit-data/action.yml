name: 'Commit Data Changes'
description: 'Commit and push changes under data/ if any exist'

inputs:
  message:
    description: 'Commit message'
    required: false
    default: 'chore: update data'

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/
        if git diff --cached --quiet; then
          echo "No data changes to commit"
        else
          git commit -m "${{ inputs.message }}"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $i/3), rebasing onto latest and retrying"
            git pull --rebase
          done
          exit 1
        fi
