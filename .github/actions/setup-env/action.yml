name: 'Setup Python Environment'
description: 'Install dependencies with uv (repo must already be checked out)'

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: '3.13'

    - name: Install dependencies
      shell: bash
      run: uv sync --locked
